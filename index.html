<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Survey: The Future of IB and International School Libraries in the Age of AI</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a33;--mute:#5d6b75;--line:#dcd8cc;--acc:#1f5f5b;--acc2:#e8f1ef;--warn:#b3402a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191d;--card:#1d252b;--ink:#e8ecee;--mute:#9aa8b1;--line:#34414a;--acc:#6fc3bb;--acc2:#1f3330;--warn:#ff8f78}}
:root[data-theme="dark"]{--bg:#14191d;--card:#1d252b;--ink:#e8ecee;--mute:#9aa8b1;--line:#34414a;--acc:#6fc3bb;--acc2:#1f3330;--warn:#ff8f78}
html{scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,'Times New Roman',serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;font:13px system-ui,sans-serif;color:var(--mute);display:flex;gap:12px;align-items:center}
.bar .t{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar .t i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
main{max-width:820px;margin:0 auto;padding:20px 14px 60px}
header.h{background:var(--acc);color:#fff;border-radius:14px;padding:28px 24px;margin-bottom:18px}
header.h h1{margin:0 0 8px;font-size:1.6rem;line-height:1.25}header.h p{margin:6px 0 0;opacity:.92;font:15px/1.5 system-ui,sans-serif}
h2{font-size:1.15rem;margin:30px 0 10px;color:var(--acc);border-bottom:2px solid var(--acc2);padding-bottom:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.q.err{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.q>.l{font-weight:700;margin-bottom:4px}.q>.l b{color:var(--acc);margin-right:6px}
.q .n{font:13px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}
.em{display:none;color:var(--warn);font:13px system-ui,sans-serif;margin-top:6px}.q.err .em{display:block}
label.o{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font:15px/1.4 system-ui,sans-serif}
label.o:hover{background:var(--acc2)}label.o input{margin-top:3px;accent-color:var(--acc);width:17px;height:17px;flex:none}
.sp{margin:2px 0 6px 34px;width:calc(100% - 34px)}
input[type=text],input[type=email],textarea{width:100%;font:15px system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.gw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font:14px system-ui,sans-serif}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}th{font-weight:600;color:var(--mute);font-size:12px}
td:first-child,th:first-child{text-align:left;width:34%}td input{width:18px;height:18px;accent-color:var(--acc)}
tr.err td:first-child{color:var(--warn);font-weight:600}tbody tr:hover{background:var(--acc2)}
.btn{font:600 15px system-ui,sans-serif;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.s{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ok{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center}
.ok h2{border:0;margin-top:0}.note{font:13px system-ui,sans-serif;color:var(--mute)}
.res .bw{display:flex;align-items:center;gap:8px;font:13px system-ui,sans-serif;margin:3px 0}.res .bw span.a{flex:0 0 40%}.res .bw .b{flex:1;background:var(--acc2);border-radius:4px;height:16px}.res .bw .b i{display:block;height:100%;background:var(--acc);border-radius:4px}
.res blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--acc);font:14px system-ui,sans-serif;background:var(--bg)}
.hide{display:none}
</style></head><body>
<div class="bar"><span id="pt">0% complete</span><div class="t"><i id="pb"></i></div></div>
<main id="app"></main>
<script>
const SC=["1 – Not a challenge","2 – Minor","3 – Moderate","4 – Significant","5 – Major"];
const LIK=["Very Unconfident","Unconfident","Neutral","Confident","Very Confident"];
const S=[
{t:"Section A: About You",q:[
{id:1,x:"What is your current role?",ty:"s",o:["Teacher Librarian","Head Librarian / Library Coordinator","MYP Coordinator","DP Coordinator","CP Coordinator","ATL Coordinator","Curriculum Leader","Teacher","School Leader","Other (please specify)"],oth:1},
{id:2,x:"What type of school do you work in?",ty:"s",o:["IB World School","IB Candidate School","International School","IB + National Curriculum School","Other"],oth:1},
{id:3,x:"Which IB programmes does your school offer?",n:"Select all that apply.",ty:"m",o:["PYP","MYP","DP","CP"]},
{id:4,x:"In which region is your school located?",ty:"s",o:["Africa","Asia-Pacific","Europe","Middle East","North America","Latin America","Other"],oth:1},
{id:5,x:"Approximately how many students are enrolled in your school?",ty:"s",o:["Under 500","500-1000","1001-2000","More than 2000"]}]},
{t:"Section B: Current Challenges (2026)",q:[
{id:6,x:"To what extent are the following currently a challenge in your school library?",n:"Scale: 1 = Not a Challenge, 2 = Minor, 3 = Moderate, 4 = Significant, 5 = Major Challenge",ty:"g",c:["1","2","3","4","5"],r:["AI-generated student work","Academic integrity concerns","Student misinformation","Digital literacy gaps","Media literacy challenges","Declining reading engagement","Low usage of library databases","Budget constraints","Demonstrating library impact","Supporting student wellbeing","Maintaining diverse collections","Staff AI literacy"]}]},
{t:"Section C: Looking Ahead to 2030",q:[
{id:7,x:"How significant do you believe the following challenges will become by 2030?",n:"Scale: 1 = Not significant … 5 = Extremely significant",ty:"g",c:["1","2","3","4","5"],r:["Ethical use of AI","AI-assisted plagiarism","Verification of information","Deepfakes and misinformation","Digital citizenship","Data literacy","Reading engagement","Budget pressures","Evolving librarian roles","Keeping pace with technology"]}]},
{t:"Section D: AI Readiness",q:[
{id:8,x:"Does your school currently have any of the following?",ty:"g",c:["Yes","No"],r:["AI Policy","AI Guidelines for Students","AI Guidelines for Teachers","AI Citation Guidance","Academic Integrity Policy addressing AI","Staff AI Professional Development","Student AI Literacy Programme"]},
{id:9,x:"How confident are teachers in your school in using AI responsibly?",ty:"s",o:LIK},
{id:10,x:"How confident are students in evaluating AI-generated information?",ty:"s",o:LIK}]},
{t:"Section E: The Future Role of School Libraries",q:[
{id:11,x:"What do you see as the three most important roles of school librarians by 2030?",n:"Select up to THREE.",ty:"m",max:3,o:["Research Skills Specialist","AI Literacy Specialist","Academic Integrity Leader","Digital Citizenship Educator","Information Literacy Specialist","Reading Advocate","Curriculum Partner","Data Literacy Educator","Technology Integration Coach","Student Wellbeing Supporter","Learning Commons Manager","Professional Learning Facilitator"]},
{id:12,x:"Which area should receive the highest priority in international school libraries over the next five years?",ty:"s",o:["Reading and Literature","AI Literacy","Research Skills","Academic Integrity","Digital Citizenship","Information Literacy","Student Wellbeing","Technology Integration"]}]},
{t:"Section F: Research Skills and AI Literacy",q:[
{id:13,x:"How important is it for schools to implement a structured, whole-school approach to Research Skills, AI Literacy, Academic Integrity, and Digital Citizenship?",ty:"s",o:["Not Important","Slightly Important","Moderately Important","Important","Extremely Important"]},
{id:14,x:"Which student competencies are most critical for success in the AI era?",n:"Select up to FIVE.",ty:"m",max:5,o:["Critical Thinking","Source Evaluation","Ethical AI Use","Academic Writing","Referencing and Citation","Information Literacy","Research Skills","Media Literacy","Problem Solving","Reflection and Metacognition","Data Literacy","Digital Citizenship"]}]},
{t:"Section G: Professional Learning Needs",q:[
{id:15,x:"In which areas would you most value professional learning?",n:"Select up to THREE.",ty:"m",max:3,o:["AI Literacy","Prompt Engineering","Academic Integrity","Research Skills Instruction","ATL Skills Development","Information Literacy","Data Literacy","Media Literacy","Digital Citizenship","Reading Promotion","Collection Development"]}]},
{t:"Section H: Open Responses",q:[
{id:16,x:"What is the single biggest challenge facing your library today?",ty:"t",opt:1},
{id:17,x:"What do you believe will be the biggest challenge facing school libraries by 2030?",ty:"t",opt:1},
{id:18,x:"What support do school librarians need most from school leadership?",ty:"t",opt:1},
{id:19,x:"What support would you like to receive from IB, professional organizations, or library associations?",ty:"t",opt:1},
{id:20,x:"Is there anything else you would like to share about the future of school libraries?",ty:"t",opt:1}]}
];
const ALLQ=S.flatMap(s=>s.q);
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a)){if(n==="class")e.className=v;else if(n==="text")e.textContent=v;else e.setAttribute(n,v)}k.flat().forEach(c=>c!=null&&e.append(c));return e};
const app=document.getElementById("app");
const state={};let want=null,db=null,dl=null,isAdmin=false;
const form=$("div");
function build(){
 app.append($("header",{class:"h"},$("h1",{text:"Global Survey: The Future of IB and International School Libraries in the Age of AI"}),
  $("p",{text:"Thank you for participating. This survey explores the current and future challenges facing IB and international school libraries in an era of artificial intelligence, digital transformation, changing research practices, and evolving student needs."}),
  $("p",{text:"It takes approximately 8–10 minutes. Responses are used for research and professional learning purposes. Individual schools and respondents will not be identified."})),form);
 S.forEach(sec=>{form.append($("h2",{text:sec.t}));sec.q.forEach(q=>form.append(qEl(q)))});
 // Q21
 const c=$("div",{class:"q",id:"q21"},$("div",{class:"l"},$("b",{text:"21."}),"If a global report on “The Future of IB and International School Libraries” becomes available, would you like to receive a copy?"),
  $("div",{class:"n",text:"Optional. Your contact details are stored separately from your answers."}));
 ["Yes","No"].forEach(v=>c.append($("label",{class:"o"},$("input",{type:"radio",name:"q21",value:v}),v)));
 const ct=$("div",{class:"hide",id:"ct"},$("input",{type:"text",id:"cn",placeholder:"Name",class:"sp"}),$("input",{type:"email",id:"ce",placeholder:"Email",class:"sp",style:"margin-top:6px"}));
 c.append(ct);c.addEventListener("change",e=>{if(e.target.name==="q21")ct.classList.toggle("hide",e.target.value!=="Yes")});
 form.append($("h2",{text:"Bonus Question"}),c);
 form.append($("div",{class:"row"},$("button",{class:"btn",id:"sub",text:"Submit survey"}),$("button",{class:"btn s",id:"dlb",text:"Save a copy of my answers"}),$("button",{class:"btn s hide",id:"rb",text:"View results (editors)"})),
  $("p",{class:"note",id:"msg"}));
 document.getElementById("sub").onclick=submit;
 document.getElementById("dlb").onclick=()=>saveCopy(collect(false));
 form.addEventListener("change",progress);form.addEventListener("input",progress);progress();
}
function qEl(q){
 const d=$("div",{class:"q",id:"q"+q.id},$("div",{class:"l"},$("b",{text:q.id+"."}),q.x+(q.opt?"":" *")));
 if(q.n)d.append($("div",{class:"n",text:q.n}));
 if(q.ty==="s"||q.ty==="m"){
  const mx=q.max;
  q.o.forEach((o,i)=>{const inp=$("input",{type:q.ty==="s"?"radio":"checkbox",name:"q"+q.id,value:o});
   d.append($("label",{class:"o"},inp,o));
   if(q.oth&&(i===q.o.length-1)){d.append($("input",{type:"text",class:"sp hide",id:"ot"+q.id,placeholder:"Please specify"}))}});
  d.addEventListener("change",e=>{
   if(mx&&e.target.type==="checkbox"&&e.target.checked&&d.querySelectorAll("input:checked").length>mx){e.target.checked=false;const m=d.querySelector(".em");m.textContent="You can select up to "+mx+" options.";d.classList.add("err");setTimeout(()=>{d.classList.remove("err")},2200);return}
   if(q.oth){const sel=d.querySelector("input:checked");const last=q.o[q.o.length-1];d.querySelector(".sp").classList.toggle("hide",!(sel&&sel.value===last))}
   d.classList.remove("err")});
 }else if(q.ty==="g"){
  const t=$("table",{},$("thead",{},$("tr",{},$("th",{text:"Item"}),q.c.map(c=>$("th",{text:c})))),
   $("tbody",{},q.r.map((r,ri)=>$("tr",{"data-r":ri},$("td",{text:r}),q.c.map(c=>$("td",{},$("input",{type:"radio",name:"q"+q.id+"_"+ri,value:c,"aria-label":r+": "+c})))))));
  d.append($("div",{class:"gw"},t));
  t.addEventListener("change",e=>e.target.closest("tr").classList.remove("err"));
 }else d.append($("textarea",{id:"t"+q.id,placeholder:"Type your response…"}));
 d.append($("div",{class:"em",text:"Please answer this question."}));
 return d;
}
function val(q){
 const f=n=>[...form.querySelectorAll('input[name="'+n+'"]:checked')].map(i=>i.value);
 if(q.ty==="s"){const v=f("q"+q.id)[0];if(!v)return null;if(q.oth&&v===q.o[q.o.length-1]){const o=document.getElementById("ot"+q.id).value.trim();return o?v+": "+o:v}return v}
 if(q.ty==="m"){const v=f("q"+q.id);return v.length?v:null}
 if(q.ty==="g"){const o={};q.r.forEach((r,i)=>{const v=f("q"+q.id+"_"+i)[0];if(v)o[r]=v});return Object.keys(o).length?o:null}
 const v=document.getElementById("t"+q.id).value.trim();return v||null;
}
function complete(q){const v=val(q);if(v==null)return false;if(q.ty==="g")return Object.keys(v).length===q.r.length;return true}
function progress(){
 const req=ALLQ.filter(q=>!q.opt);const n=req.filter(complete).length;const p=Math.round(100*n/req.length);
 document.getElementById("pb").style.width=p+"%";document.getElementById("pt").textContent=p+"% complete ("+n+" of "+req.length+" required)";
}
function collect(){const a={};ALLQ.forEach(q=>{const v=val(q);if(v!=null)a["q"+q.id]=v});return a}
function validate(){
 let first=null;
 ALLQ.filter(q=>!q.opt).forEach(q=>{
  const el=document.getElementById("q"+q.id);const ok=complete(q);el.classList.toggle("err",!ok);
  el.querySelector(".em").textContent=q.ty==="g"?"Please answer every row.":"Please answer this question.";
  if(q.ty==="g"){el.querySelectorAll("tbody tr").forEach((tr,i)=>tr.classList.toggle("err",!(val(q)&&val(q)[q.r[i]])))}
  if(!ok&&!first)first=el});
 const w=form.querySelector('input[name="q21"]:checked');
 if(w&&w.value==="Yes"&&!document.getElementById("ce").value.trim()){first=first||document.getElementById("q21");document.getElementById("msg").textContent="Please add an email address, or choose No for question 21."}
 if(first){first.scrollIntoView({behavior:"smooth",block:"center"});return false}return true;
}
function csvOf(a){
 const rows=[["Question","Answer"]];
 ALLQ.forEach(q=>{const v=a["q"+q.id];let s="";if(v!=null)s=typeof v==="string"?v:Array.isArray(v)?v.join("; "):Object.entries(v).map(([k,x])=>k+"="+x).join("; ");rows.push([q.id+". "+q.x,s])});
 return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
}
async function saveCopy(a){
 if(!dl){document.getElementById("msg").textContent="Download isn’t available in this view.";return}
 try{await dl.save({filename:"ib-library-survey-my-answers.csv",data:csvOf(a)})}catch(e){document.getElementById("msg").textContent="Save was cancelled or unavailable."}
}
async function submit(){
 const msg=document.getElementById("msg");msg.textContent="";
 if(!validate())return;
 const a=collect();const w=form.querySelector('input[name="q21"]:checked');
 const btn=document.getElementById("sub");btn.disabled=true;btn.textContent="Submitting…";
 let stored=false;
 if(db){try{
   const uc=await claude.use("user");const id=await uc.id();
   await db.collection("responses").doc(id).set({submittedAt:new Date().toISOString(),answers:a,wantsReport:w?w.value:null});
   if(w&&w.value==="Yes")await db.collection("contacts").doc(id).set({name:document.getElementById("cn").value.trim(),email:document.getElementById("ce").value.trim()});
   stored=true}catch(e){stored=false}}
 const ok=$("div",{class:"ok"},$("h2",{text:stored?"Thank you!":"Almost done"}),
  $("p",{text:stored?"Your response has been recorded. Your insights will help shape the future of IB and international school libraries.":"We couldn’t record your response automatically in this view. Please save a copy of your answers and send it to the survey organiser."}),
  $("div",{class:"row",style:"justify-content:center"},$("button",{class:"btn s",text:"Save a copy of my answers",onclick:"void 0"})));
 ok.querySelector("button").onclick=()=>saveCopy(a);
 form.replaceWith(ok);window.scrollTo(0,0);
}
async function showResults(){
 const rs=await db.collection("responses").get();const ds=rs.docs.map(d=>d.data());
 let cs=[];try{cs=(await db.collection("contacts").get()).docs.map(d=>d.data())}catch(e){}
 const r=$("div",{class:"res"},$("h2",{text:"Results – "+ds.length+" response"+(ds.length===1?"":"s")}));
 ALLQ.forEach(q=>{
  const box=$("div",{class:"q"},$("div",{class:"l"},$("b",{text:q.id+"."}),q.x));
  const vals=ds.map(d=>d.answers&&d.answers["q"+q.id]).filter(v=>v!=null);
  if(q.ty==="t")vals.forEach(v=>box.append($("blockquote",{text:v})));
  else if(q.ty==="g"){q.r.forEach(row=>{const xs=vals.map(v=>v[row]).filter(Boolean);
    const avg=q.c[0]==="1"?(xs.reduce((s,x)=>s+Number(x),0)/(xs.length||1)).toFixed(2):null;
    const cnt=q.c.map(c=>c+":"+xs.filter(x=>x===c).length).join("  ");
    box.append($("div",{class:"bw"},$("span",{class:"a",text:row}),$("span",{text:(avg?"avg "+avg+"  |  ":"")+cnt})))})}
  else{const tally={};vals.forEach(v=>(Array.isArray(v)?v:[v]).forEach(x=>{const k=x.split(": ")[0];tally[k]=(tally[k]||0)+1}));
   const mx=Math.max(1,...Object.values(tally));
   q.o.forEach(o=>{const n=tally[o]||0;box.append($("div",{class:"bw"},$("span",{class:"a",text:o}),$("div",{class:"b"},$("i",{style:"width:"+(100*n/mx)+"%"})),$("span",{text:String(n)})))})}
  r.append(box)});
 r.append($("div",{class:"row"},$("button",{class:"btn",text:"Download all responses (CSV)",onclick:"void 0"}),$("p",{class:"note",text:cs.length+" report request(s) with contact details stored separately."})));
 r.querySelector("button").onclick=()=>{
  const head=["Submitted","Wants report"].concat(ALLQ.map(q=>q.id+". "+q.x));
  const rows=ds.map(d=>[d.submittedAt,d.wantsReport||""].concat(ALLQ.map(q=>{const v=d.answers["q"+q.id];return v==null?"":typeof v==="string"?v:Array.isArray(v)?v.join("; "):Object.entries(v).map(([k,x])=>k+"="+x).join("; ")})));
  const csv=[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  dl&&dl.save({filename:"ib-library-survey-responses.csv",data:csv}).catch(()=>{})};
 form.classList.add("hide");document.getElementById("rb").classList.add("hide");
 app.append(r);window.scrollTo(0,0);
}
build();
(async()=>{
 try{dl=await claude.use("downloads")}catch(e){}
 if(!dl)document.getElementById("dlb").classList.add("hide");
 try{db=await claude.use("db")}catch(e){}
 try{const u=await claude.use("user");isAdmin=u?await u.canEdit():false}catch(e){}
 if(db&&isAdmin){const b=document.getElementById("rb");b.classList.remove("hide");b.onclick=()=>showResults().catch(()=>{b.textContent="Couldn’t load results"})}
})();
</script></body></html>
