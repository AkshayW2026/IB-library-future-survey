async function results(){

 const r=$("div",{class:"res"},$("h2",{text:"Results: "+ds.length+" response"+(ds.length===1?"":"s")}));
 Q.filter(q=>q.id!=="q21").forEach(q=>{const box=$("div",{class:"q"},$("div",{class:"l",text:q.x}));const vs=ds.map(d=>d.answers&&d.answers[q.id]).filter(v=>v!=null);
  if(q.ty==="t")vs.forEach(v=>box.append($("blockquote",{text:v})));
  else if(q.ty==="g")q.r.forEach(row=>{const xs=vs.map(v=>v[row]).filter(Boolean);const avg=q.c[0]==="1"?"avg "+(xs.reduce((s,x)=>s+ +x,0)/(xs.length||1)).toFixed(2)+" · ":"";box.append($("div",{class:"bw"},$("span",{text:row}),$("span",{text:avg+q.c.map(c=>c+": "+xs.filter(x=>x===c).length).join("  ")})))});
  else{const t={};vs.forEach(v=>(Array.isArray(v)?v:[v]).forEach(x=>t[x]=(t[x]||0)+1));q.o.forEach(o=>box.append($("div",{class:"bw"},$("span",{text:o}),$("span",{text:String(t[o]||0)}))))}
  r.append(box)});
 const b=$("button",{class:"btn",type:"button",text:"Download all responses (CSV)"});

  dl&&dl.save({filename:"ib-library-survey-responses.csv",data:[H].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")}).catch(()=>{})};
 r.append(b,$("p",{class:"note",text:nc+" report request(s) with contact details stored separately."}));app.replaceChildren(r);window.scrollTo(0,0);
}
